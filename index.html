<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Timer App</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <h1 class="title">Timer</h1>

    <div class="display">
      <div class="time-block">
        <span class="value" id="days">00</span>
        <span class="label">days</span>
      </div>
      <span class="sep">:</span>
      <div class="time-block">
        <span class="value" id="hours">00</span>
        <span class="label">hours</span>
      </div>
      <span class="sep">:</span>
      <div class="time-block">
        <span class="value" id="minutes">00</span>
        <span class="label">min</span>
      </div>
      <span class="sep">:</span>
      <div class="time-block">
        <span class="value" id="seconds">00</span>
        <span class="label">sec</span>
      </div>
      <span class="sep">.</span>
      <div class="time-block ms-block">
        <span class="value" id="milliseconds">000</span>
        <span class="label">ms</span>
      </div>
    </div>

    <div class="controls">
      <button id="btn-start" class="btn btn-primary">Start</button>
      <button id="btn-lap" class="btn btn-secondary" disabled>Lap</button>
      <button id="btn-reset" class="btn btn-danger" disabled>Reset</button>
    </div>

    <div class="laps-section" id="laps-section">
      <h2 class="laps-title">Laps</h2>
      <ol class="laps-list" id="laps-list" reversed></ol>
    </div>
  </div>

  <script src="timer.js"></script>
</body>
</html>
