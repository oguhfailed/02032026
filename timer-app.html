<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Timer App</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #0f0f13;
      --surface: #1a1a24;
      --surface2: #22223a;
      --accent: #6c63ff;
      --accent-dim: #4a44b5;
      --danger: #ff4d4d;
      --danger-dim: #b53535;
      --text: #e8e8f0;
      --text-muted: #8888aa;
      --sep: #333355;
      --lap-even: #1e1e2e;
      --lap-odd: #16161f;
      --radius: 12px;
      --font-mono: 'Courier New', Courier, monospace;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 2rem 1rem 4rem;
    }

    .app {
      width: 100%;
      max-width: 680px;
    }

    .title {
      text-align: center;
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 2rem;
    }

    .display {
      background: var(--surface);
      border: 1px solid var(--sep);
      border-radius: var(--radius);
      padding: 2rem 1.5rem;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 0.25rem;
      flex-wrap: wrap;
      margin-bottom: 2rem;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    .time-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.35rem;
    }

    .value {
      font-family: var(--font-mono);
      font-size: clamp(2rem, 6vw, 3.5rem);
      font-weight: 700;
      color: var(--text);
      line-height: 1;
      min-width: 2ch;
      text-align: center;
      transition: color 0.1s;
    }

    .ms-block .value {
      font-size: clamp(1.4rem, 4vw, 2.2rem);
      color: var(--accent);
      min-width: 3ch;
    }

    .label {
      font-size: 0.65rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .sep {
      font-family: var(--font-mono);
      font-size: clamp(2rem, 6vw, 3.5rem);
      font-weight: 700;
      color: var(--sep);
      line-height: 1;
      align-self: flex-start;
      user-select: none;
    }

    .running .ms-block .value {
      animation: pulse 1s ease-in-out infinite alternate;
    }

    @keyframes pulse {
      from { opacity: 1; }
      to   { opacity: 0.5; }
    }

    .controls {
      display: flex;
      gap: 1rem;
      justify-content: center;
      margin-bottom: 2.5rem;
      flex-wrap: wrap;
    }

    .btn {
      padding: 0.75rem 2rem;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s, opacity 0.15s;
      letter-spacing: 0.05em;
      min-width: 110px;
    }

    .btn:active:not(:disabled) { transform: scale(0.96); }
    .btn:disabled { opacity: 0.35; cursor: not-allowed; }

    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover:not(:disabled) { background: var(--accent-dim); }

    .btn-secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--sep); }
    .btn-secondary:hover:not(:disabled) { background: #2a2a4a; }

    .btn-danger { background: var(--danger); color: #fff; }
    .btn-danger:hover:not(:disabled) { background: var(--danger-dim); }

    .laps-section { display: none; }
    .laps-section.visible { display: block; }

    .laps-title {
      font-size: 0.8rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 0.75rem;
      text-align: center;
    }

    .laps-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      max-height: 320px;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--sep) transparent;
    }

    .laps-list::-webkit-scrollbar { width: 6px; }
    .laps-list::-webkit-scrollbar-thumb { background: var(--sep); border-radius: 3px; }

    .lap-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.6rem 1rem;
      border-radius: 8px;
      font-family: var(--font-mono);
      font-size: 0.9rem;
      animation: slide-in 0.2s ease;
    }

    @keyframes slide-in {
      from { opacity: 0; transform: translateY(-6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .lap-item:nth-child(odd)  { background: var(--lap-odd); }
    .lap-item:nth-child(even) { background: var(--lap-even); }
    .lap-item.best  .lap-time { color: #4caf50; }
    .lap-item.worst .lap-time { color: var(--danger); }

    .lap-num   { color: var(--text-muted); font-size: 0.8rem; }
    .lap-split { color: var(--text-muted); font-size: 0.8rem; }
    .lap-time  { color: var(--text); }

    @media (max-width: 420px) {
      .display { gap: 0.1rem; padding: 1.5rem 0.5rem; }
      .sep { font-size: 1.8rem; }
    }
  </style>
</head>
<body>
  <div class="app">
    <h1 class="title">Timer</h1>

    <div class="display">
      <div class="time-block">
        <span class="value" id="days">00</span>
        <span class="label">days</span>
      </div>
      <span class="sep">:</span>
      <div class="time-block">
        <span class="value" id="hours">00</span>
        <span class="label">hours</span>
      </div>
      <span class="sep">:</span>
      <div class="time-block">
        <span class="value" id="minutes">00</span>
        <span class="label">min</span>
      </div>
      <span class="sep">:</span>
      <div class="time-block">
        <span class="value" id="seconds">00</span>
        <span class="label">sec</span>
      </div>
      <span class="sep">.</span>
      <div class="time-block ms-block">
        <span class="value" id="milliseconds">000</span>
        <span class="label">ms</span>
      </div>
    </div>

    <div class="controls">
      <button id="btn-start" class="btn btn-primary">Start</button>
      <button id="btn-lap"   class="btn btn-secondary" disabled>Lap</button>
      <button id="btn-reset" class="btn btn-danger"    disabled>Reset</button>
    </div>

    <div class="laps-section" id="laps-section">
      <h2 class="laps-title">Laps</h2>
      <ol class="laps-list" id="laps-list" reversed></ol>
    </div>
  </div>

  <script>
    'use strict';

    const elDays   = document.getElementById('days');
    const elHours  = document.getElementById('hours');
    const elMins   = document.getElementById('minutes');
    const elSecs   = document.getElementById('seconds');
    const elMs     = document.getElementById('milliseconds');

    const btnStart = document.getElementById('btn-start');
    const btnLap   = document.getElementById('btn-lap');
    const btnReset = document.getElementById('btn-reset');

    const lapsSection = document.getElementById('laps-section');
    const lapsList    = document.getElementById('laps-list');
    const display     = document.querySelector('.display');

    let startTime   = 0;
    let accumulated = 0;
    let rafId       = null;
    let running     = false;
    let lapStart    = 0;
    let lapTimes    = [];

    function pad(n, digits = 2) {
      return String(Math.floor(n)).padStart(digits, '0');
    }

    function formatTime(ms) {
      const totalMs   = Math.floor(ms);
      const millisecs = totalMs % 1000;
      const totalSecs = Math.floor(totalMs / 1000);
      const seconds   = totalSecs % 60;
      const totalMins = Math.floor(totalSecs / 60);
      const minutes   = totalMins % 60;
      const totalHrs  = Math.floor(totalMins / 60);
      const hours     = totalHrs % 24;
      const days      = Math.floor(totalHrs / 24);
      return { days, hours, minutes, seconds, millisecs };
    }

    function renderTime(ms) {
      const { days, hours, minutes, seconds, millisecs } = formatTime(ms);
      elDays.textContent  = pad(days);
      elHours.textContent = pad(hours);
      elMins.textContent  = pad(minutes);
      elSecs.textContent  = pad(seconds);
      elMs.textContent    = pad(millisecs, 3);
    }

    function elapsed() {
      return accumulated + (performance.now() - startTime);
    }

    function tick() {
      renderTime(elapsed());
      rafId = requestAnimationFrame(tick);
    }

    function lapTimeString(ms) {
      const { days, hours, minutes, seconds, millisecs } = formatTime(ms);
      let s = '';
      if (days) s += `${pad(days)}d `;
      if (days || hours) s += `${pad(hours)}:`;
      s += `${pad(minutes)}:${pad(seconds)}.${pad(millisecs, 3)}`;
      return s;
    }

    function findBestWorst() {
      if (lapTimes.length < 2) return { best: -1, worst: -1 };
      let best = 0, worst = 0;
      for (let i = 1; i < lapTimes.length; i++) {
        if (lapTimes[i].split < lapTimes[best].split)  best  = i;
        if (lapTimes[i].split > lapTimes[worst].split) worst = i;
      }
      return { best, worst };
    }

    function rebuildLaps() {
      const { best, worst } = findBestWorst();
      lapsList.innerHTML = '';
      for (let i = 0; i < lapTimes.length; i++) {
        const { total, split } = lapTimes[i];
        const li = document.createElement('li');
        li.className = 'lap-item';
        if (lapTimes.length > 1) {
          if (i === best)  li.classList.add('best');
          if (i === worst) li.classList.add('worst');
        }
        li.innerHTML = `
          <span class="lap-num">Lap ${i + 1}</span>
          <span class="lap-time">${lapTimeString(total)}</span>
          <span class="lap-split">+${lapTimeString(split)}</span>
        `;
        lapsList.prepend(li);
      }
    }

    btnStart.addEventListener('click', () => {
      if (!running) {
        startTime = performance.now();
        running   = true;
        rafId     = requestAnimationFrame(tick);
        display.classList.add('running');
        btnStart.textContent = 'Stop';
        btnStart.classList.replace('btn-primary', 'btn-danger');
        btnLap.disabled   = false;
        btnReset.disabled = true;
      } else {
        accumulated = elapsed();
        cancelAnimationFrame(rafId);
        rafId   = null;
        running = false;
        display.classList.remove('running');
        btnStart.textContent = 'Resume';
        btnStart.classList.replace('btn-danger', 'btn-primary');
        btnLap.disabled   = true;
        btnReset.disabled = false;
      }
    });

    btnLap.addEventListener('click', () => {
      if (!running) return;
      const now   = elapsed();
      const split = now - lapStart;
      lapTimes.push({ total: now, split });
      lapStart = now;
      rebuildLaps();
      lapsSection.classList.add('visible');
    });

    btnReset.addEventListener('click', () => {
      cancelAnimationFrame(rafId);
      rafId = null; accumulated = 0; startTime = 0; lapStart = 0;
      lapTimes = []; running = false;
      renderTime(0);
      lapsList.innerHTML = '';
      lapsSection.classList.remove('visible');
      display.classList.remove('running');
      btnStart.textContent = 'Start';
      btnStart.classList.replace('btn-danger', 'btn-primary');
      btnLap.disabled   = true;
      btnReset.disabled = true;
    });

    document.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
      if (e.code === 'Space') { e.preventDefault(); btnStart.click(); }
      if (e.code === 'KeyL' && !btnLap.disabled)   btnLap.click();
      if (e.code === 'KeyR' && !btnReset.disabled) btnReset.click();
    });

    renderTime(0);
  </script>
</body>
</html>
